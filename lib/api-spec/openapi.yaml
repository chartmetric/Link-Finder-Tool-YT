openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile-search
    description: Public profile discovery
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles/search:
    post:
      operationId: searchProfiles
      tags: [profile-search]
      summary: Find Instagram, TikTok, and YouTube profiles from a name, known handle, or both
      description: Searches selected discovery providers, expands a known social handle through ScrapeCreators, and independently verifies candidates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSearchInput"
      responses:
        "200":
          description: Ranked profile matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSearchResponse"
        "400":
          description: Invalid person, creator, team, or brand name
        "503":
          description: Serper API key is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProfileSearchInput:
      type: object
      properties:
        subject:
          type: string
          minLength: 2
          maxLength: 120
        handle:
          type: string
          minLength: 2
          maxLength: 120
          description: Known social handle, with or without a leading @
        handlePlatform:
          type: string
          enum: [instagram, tiktok, youtube, x, twitter, facebook]
          description: Platform where the known handle belongs
        location:
          type: string
          maxLength: 100
        country:
          type: string
          minLength: 2
          maxLength: 2
          default: us
        methods:
          type: array
          items:
            type: string
            enum: [serper, tavily, gemini, scrapecreators]
    ProfileMatch:
      type: object
      properties:
        platform:
          type: string
        category:
          type: string
          enum: [social]
        title:
          type: string
        url:
          type: string
        displayUrl:
          type: string
        snippet:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 100
        signals:
          type: array
          items:
            type: string
        methods:
          type: array
          items:
            type: string
      required:
        - platform
        - category
        - title
        - url
        - displayUrl
        - snippet
        - confidence
        - signals
        - methods
    SearchMethodUsage:
      type: object
      properties:
        method:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [used, unavailable, failed]
        estimatedCostUsd:
          type: number
        costNote:
          type: string
      required:
        - method
        - label
        - status
        - estimatedCostUsd
        - costNote
    SearchSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        snippet:
          type: string
      required:
        - title
        - url
        - snippet
    ProfileSearchResponse:
      type: object
      properties:
        subject:
          type: string
        query:
          type: string
        searchedAt:
          type: string
          format: date-time
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileMatch"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SearchSource"
        totalFound:
          type: number
        highConfidenceCount:
          type: number
        methodsUsed:
          type: array
          items:
            $ref: "#/components/schemas/SearchMethodUsage"
        estimatedCostUsd:
          type: number
      required:
        - subject
        - query
        - searchedAt
        - profiles
        - sources
        - totalFound
        - highConfidenceCount
        - methodsUsed
        - estimatedCostUsd

