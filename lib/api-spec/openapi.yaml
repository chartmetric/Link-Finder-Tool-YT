openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile-search
    description: Public profile discovery
paths:
  /profiles/musician-coverage:
    get:
      operationId: getMusicianCoverage
      tags: [profile-search]
      summary: Count tier 1-3 musicians and their link coverage
      responses:
        "200":
          description: Distinct musician counts using each profile's latest global tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicianCoverage"
        "503":
          description: Coverage statistics unavailable
  /profiles/investigations:
    get:
      operationId: listProfileInvestigations
      tags: [profile-search]
      summary: List saved single-profile investigations, newest first
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Saved investigations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileInvestigationPage"
        "400":
          description: Invalid pagination
        "503":
          description: Investigation history storage unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles/search:
    post:
      operationId: searchProfiles
      tags: [profile-search]
      summary: Find Instagram, TikTok, and YouTube profiles from a name, known handle, or both
      description: Searches selected discovery providers, expands a known social handle through ScrapeCreators, and independently verifies candidates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSearchInput"
      responses:
        "200":
          description: Ranked profile matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSearchResponse"
        "400":
          description: Invalid person, creator, team, or brand name
        "503":
          description: Serper API key is not configured
  /profiles:
    get:
      operationId: listExistingProfiles
      tags: [profile-search]
      summary: List musicians with their existing linked accounts
      parameters:
        - name: profileType
          in: query
          schema:
            type: string
            enum: [musician, brand, creator, actor]
            default: musician
        - name: query
          in: query
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: tier
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [tier_rank, name]
            default: tier_rank
        - name: sortDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Existing profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExistingProfilePage"
        "503":
          description: ClickHouse is not configured
  /profiles/{profileId}/suggestions:
    post:
      operationId: approveProfileSuggestions
      tags: [profile-search]
      summary: Approve and store previewed profile suggestions
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSuggestionApproval"
      responses:
        "200":
          description: Suggestions stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSuggestionApprovalResult"
        "400":
          description: Invalid suggestions
        "503":
          description: Suggestion storage is unavailable
components:
  schemas:
    MusicianCoverageTier:
      type: object
      required: [tier, profiles, withLlmLinks, withInvestigationLinks]
      properties:
        tier: { type: number }
        profiles: { type: number }
        withLlmLinks: { type: number }
        withInvestigationLinks: { type: number }
    MusicianCoverage:
      type: object
      required: [profiles, withLlmLinks, withInvestigationLinks, tiers, generatedAt]
      properties:
        profiles: { type: number }
        withLlmLinks: { type: number }
        withInvestigationLinks: { type: number }
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/MusicianCoverageTier"
        generatedAt: { type: string, format: date-time }
    ProfileInvestigation:
      type: object
      required: [id, knownProfileUrl, result]
      properties:
        id: { type: string }
        knownProfileUrl: { type: string }
        result:
          $ref: "#/components/schemas/ProfileSearchResponse"
    ProfileInvestigationPage:
      type: object
      required: [investigations, page, limit, hasMore]
      properties:
        investigations:
          type: array
          items:
            $ref: "#/components/schemas/ProfileInvestigation"
        page: { type: number }
        limit: { type: number }
        hasMore: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProfileSearchInput:
      type: object
      properties:
        subject:
          type: string
          minLength: 2
          maxLength: 120
        handle:
          type: string
          minLength: 2
          maxLength: 120
          description: Known social handle, with or without a leading @
        handlePlatform:
          type: string
          enum: [instagram, tiktok, youtube, x, twitter, facebook]
          description: Platform where the known handle belongs
        knownProfileUrl:
          type: string
          maxLength: 500
          description: Existing Instagram, TikTok, or YouTube profile URL. May be submitted alone; the server resolves the account name and handle.
        location:
          type: string
          maxLength: 100
        country:
          type: string
          minLength: 2
          maxLength: 2
          default: us
        methods:
          type: array
          items:
            type: string
            enum: [serper, tavily, gemini, jev, scrapecreators, socialcrawl]
    ExistingProfile:
      type: object
      properties:
        profileId:
          type: number
        profileName:
          type: string
        profileTypes:
          type: string
        tier:
          type: number
        tierRank:
          type: number
        instagramFollowers:
          type: [number, "null"]
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ExistingProfileAccount"
      required: [profileId, profileName, profileTypes, tier, tierRank, instagramFollowers, accounts]
    ExistingProfileAccount:
      type: object
      properties:
        platform:
          type: string
        handle:
          type: string
        accountUrl:
          type: string
        source:
          type: string
      required: [platform, handle, accountUrl, source]
    ExistingProfilePage:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ExistingProfile"
        page:
          type: number
        limit:
          type: number
        hasMore:
          type: boolean
        query:
          type: string
      required: [profiles, page, limit, hasMore, query]
    ProfileSuggestionApproval:
      type: object
      properties:
        profileName:
          type: string
          minLength: 1
          maxLength: 200
        suggestions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProfileSuggestionInput"
      required: [profileName, suggestions]
    ProfileSuggestionInput:
      type: object
      properties:
        platform:
          type: string
        handle:
          type: string
        accountUrl:
          type: string
        sourceVendors:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 100
        estimatedCostUsd:
          type: number
          minimum: 0
        sourceDetails:
          type: string
      required:
        [platform, handle, accountUrl, sourceVendors, confidence, estimatedCostUsd, sourceDetails]
    ProfileSuggestionApprovalResult:
      type: object
      properties:
        inserted:
          type: number
        approvedAt:
          type: string
          format: date-time
      required: [inserted, approvedAt]
    ProfileMatch:
      type: object
      properties:
        platform:
          type: string
        category:
          type: string
          enum: [social]
        title:
          type: string
        url:
          type: string
        displayUrl:
          type: string
        snippet:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 100
        signals:
          type: array
          items:
            type: string
        methods:
          type: array
          items:
            type: string
        identityComparison:
          $ref: "#/components/schemas/IdentityComparison"
        identityVerificationNote:
          type: string
        jevVerification:
          $ref: "#/components/schemas/JevVerification"
      required:
        - platform
        - category
        - title
        - url
        - displayUrl
        - snippet
        - confidence
        - signals
        - methods
    IdentityMetadata:
      type: object
      properties:
        platform: { type: string }
        handle: { type: string }
        displayName: { type: string }
        bio: { type: string }
        imageUrl: { type: string }
        url: { type: string }
        followers: { type: number }
        verified: { type: boolean }
      required: [platform, handle, url]
    IdentityComparison:
      type: object
      properties:
        status:
          type: string
          enum: [likely, uncertain, mismatch]
        score: { type: number, minimum: 0, maximum: 100 }
        reasons:
          type: array
          items: { type: string }
        reference:
          $ref: "#/components/schemas/IdentityMetadata"
        candidate:
          $ref: "#/components/schemas/IdentityMetadata"
      required: [status, score, reasons, reference, candidate]
    JevVerification:
      type: object
      properties:
        verdict:
          type: string
          enum: [verified, likely, uncertain, mismatch]
        sameIdentityProbability:
          type: number
          minimum: 0
          maximum: 1
        verdictConfidence:
          type: number
          minimum: 0
          maximum: 1
        probabilities:
          type: object
          additionalProperties:
            type: number
      required: [verdict, sameIdentityProbability, verdictConfidence, probabilities]
    SearchMethodUsage:
      type: object
      properties:
        method:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [used, unavailable, failed]
        estimatedCostUsd:
          type: number
        costNote:
          type: string
        durationMs:
          type: number
          minimum: 0
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchSource"
      required:
        - method
        - label
        - status
        - estimatedCostUsd
        - costNote
        - durationMs
        - results
    SearchSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        snippet:
          type: string
      required:
        - title
        - url
        - snippet
    ProfileSearchResponse:
      type: object
      properties:
        historyId:
          type: string
          description: Saved investigation identifier, present when single-profile history was persisted.
        historySaveError:
          type: string
          description: Explicit warning if discovery succeeded but investigation history could not be saved.
        subject:
          type: string
        query:
          type: string
        searchedAt:
          type: string
          format: date-time
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileMatch"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SearchSource"
        totalFound:
          type: number
        highConfidenceCount:
          type: number
        methodsUsed:
          type: array
          items:
            $ref: "#/components/schemas/SearchMethodUsage"
        estimatedCostUsd:
          type: number
      required:
        - subject
        - query
        - searchedAt
        - profiles
        - sources
        - totalFound
        - highConfidenceCount
        - methodsUsed
        - estimatedCostUsd

