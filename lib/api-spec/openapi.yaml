openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile-search
    description: Public profile discovery
paths:
  /bulk/coverage:
    get:
      operationId: getBulkCoverage
      tags: [profile-search]
      summary: Evidence-backed platform resolution coverage for all bulk profile types
      responses:
        "200":
          description: Latest active catalog profiles with documented resolution on every supported platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCoverage"
        "503":
          description: Coverage could not be calculated
  /bulk/coverage/{profileType}/{group}/{platform}/{state}/profiles/{afterId}/{limit}:
    get:
      operationId: listBulkCoverageProfiles
      tags: [profile-search]
      summary: Read-only active investigated profiles in a platform evidence bucket
      description: Only profiles not fully covered are included. Explicit absence is sourced evidence for this platform, not a coverage blocker. Navigation never starts discovery or paid retries. Live keyset pagination can change as evidence or catalog membership changes.
      parameters:
        - { name: profileType, in: path, required: true, schema: { $ref: "#/components/schemas/BulkProfileType" } }
        - { name: group, in: path, required: true, schema: { $ref: "#/components/schemas/BulkCoverageGroup" } }
        - { name: platform, in: path, required: true, schema: { type: string, enum: [Instagram, TikTok, YouTube] } }
        - { name: state, in: path, required: true, schema: { $ref: "#/components/schemas/BulkCoverageState" } }
        - { name: afterId, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: Bounded page ordered by stable catalog ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkCoverageProfiles" }
        "400": { description: Invalid bucket or cursor }
        "503": { description: Coverage evidence unavailable }
  /profiles/musician-coverage:
    get:
      operationId: getMusicianCoverage
      tags: [profile-search]
      summary: Count tier 1-3 musicians and their link coverage
      responses:
        "200":
          description: Distinct musician counts using each profile's latest global tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicianCoverage"
        "503":
          description: Coverage statistics unavailable
  /profiles/musician-instagram-research-coverage:
    get:
      operationId: getMusicianInstagramResearchCoverage
      tags: [profile-search]
      summary: Count saved Tier 1-3 Instagram research results
      responses:
        "200":
          description: Latest saved research result for each current Tier 1-3 musician
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicianInstagramResearchCoverage"
        "503":
          description: Instagram research statistics unavailable
  /profiles/investigations:
    get:
      operationId: listProfileInvestigations
      tags: [profile-search]
      summary: List saved single-profile investigations, newest first
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Saved investigations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileInvestigationPage"
        "400":
          description: Invalid pagination
        "503":
          description: Investigation history storage unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles/search:
    post:
      operationId: searchProfiles
      tags: [profile-search]
      summary: Find Instagram, TikTok, and YouTube profiles from a name, known handle, or both
      description: Searches selected discovery providers, expands a known social handle through ScrapeCreators, and independently verifies candidates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSearchInput"
      responses:
        "200":
          description: Ranked profile matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSearchResponse"
        "400":
          description: Invalid person, creator, team, or brand name
        "503":
          description: Serper API key is not configured
  /bulk/billing-health:
    get:
      operationId: getBulkBillingHealth
      responses:
        "200":
          description: Known unresolved provider credit outages. This does not probe providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkBillingHealth" }
  /bulk/billing-health/clear:
    post:
      operationId: clearBulkBillingOutage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingRecoveryInput" }
      responses:
        "200":
          description: Explicit funding confirmation recorded. No provider requests or run resumes occurred.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkBillingHealth" }
        "409":
          description: Evidence changed or a queue is still active.
  /bulk/brands/candidates:
    get:
      operationId: listBulkBrandCandidates
      tags: [bulk]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 10 } }
        - { name: afterId, in: query, schema: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0 } }
        - { name: profileType, in: query, schema: { $ref: "#/components/schemas/BulkProfileType" } }
        - name: search
          in: query
          description: Case-insensitive literal substring of the latest profile name or any active linked account handle. Whitespace and an optional leading @ are ignored. Does not start an investigation.
          schema: { type: string, maxLength: 120 }
        - name: tier
          in: query
          description: Latest global tier; omit for all tiers including unranked profiles.
          schema: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "200":
          description: Filtered non-deleted profiles of the selected type, including unranked profiles and profiles without active accounts; ordered by profile ID, defaults to brands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkBrandCandidates"
        "400":
          description: Invalid profile type, search, tier, page size or cursor
        "503":
          description: Candidate catalog unavailable; no investigation has been started
  /bulk/brands/runs:
    get:
      operationId: listBulkBrandRuns
      tags: [bulk]
      responses:
        "200":
          description: Latest saved bulk runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs: { type: array, items: { $ref: "#/components/schemas/BulkBrandRun" } }
    post:
      operationId: startBulkBrandRun
      tags: [bulk]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkBrandRunInput" }
      responses:
        "200":
          description: Started or idempotently retrieved a run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkBrandRun" }
  /bulk/brands/runs/{runId}:
    get:
      operationId: getBulkBrandRun
      tags: [bulk]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Persisted queue progress and per-platform outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkBrandRun" }
  /bulk/brands/runs/{runId}/batches/{afterBatch}:
    get:
      operationId: listBulkRunBatches
      tags: [bulk]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: afterBatch, in: path, required: true, schema: { type: number, minimum: 0 } }
      responses:
        "200":
          description: Paginated saved chunks of a continuous run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkBatchArchives" }
  /bulk/brands/runs/{runId}/stop:
    post:
      operationId: stopBulkBrandRun
      tags: [bulk]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRunControl" }
      responses:
        "200":
          description: Stop requested; the current profile finishes before the queue stops
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkBrandRun" }
  /bulk/brands/runs/{runId}/resume:
    post:
      operationId: resumeBulkBrandRun
      tags: [bulk]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkRunResumeInput" }
      responses:
        "200":
          description: Resume queued and acknowledged failed items; never repeat completed or unacknowledged paid work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkBrandRun" }
  /profiles:
    get:
      operationId: listExistingProfiles
      tags: [profile-search]
      summary: List musicians with their existing linked accounts
      parameters:
        - name: profileType
          in: query
          schema:
            type: string
            enum: [musician, brand, creator, actor]
            default: musician
        - name: query
          in: query
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: tier
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [tier_rank, name]
            default: tier_rank
        - name: sortDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Existing profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExistingProfilePage"
        "503":
          description: ClickHouse is not configured
  /profiles/{profileId}/suggestions:
    post:
      operationId: approveProfileSuggestions
      tags: [profile-search]
      summary: Approve and store previewed profile suggestions
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSuggestionApproval"
      responses:
        "200":
          description: Suggestions stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSuggestionApprovalResult"
        "400":
          description: Invalid suggestions
        "503":
          description: Suggestion storage is unavailable
components:
  schemas:
    BulkCoverageGroup:
      type: string
      enum: [tiers_1_3, tiers_1_5, all]
    BulkCoverageState:
      type: string
      enum: [likely_only, needs_review, no_match, explicit_absence, provider_failure, unresolved]
    BulkCoverageStateCount:
      type: object
      required: [state, count]
      properties:
        state: { $ref: "#/components/schemas/BulkCoverageState" }
        count: { type: number }
    BulkCoveragePlatform:
      type: object
      required: [platform, states]
      properties:
        platform: { type: string, enum: [Instagram, TikTok, YouTube] }
        states:
          type: array
          items: { $ref: "#/components/schemas/BulkCoverageStateCount" }
    BulkCoverageProfile:
      type: object
      required: [profileId, profileName, tier, platform, state, reason, evidenceUrls, checkedAt, sourceRunId, referenceUrl]
      properties:
        profileId: { type: number }
        profileName: { type: string }
        tier: { type: [number, "null"] }
        platform: { type: string }
        state: { $ref: "#/components/schemas/BulkCoverageState" }
        reason: { type: string }
        evidenceUrls: { type: array, items: { type: string } }
        checkedAt: { type: string }
        sourceRunId: { type: string, description: Saved bulk run ID; empty for single-profile evidence }
        sourceHistoryId: { type: string, description: Saved single-profile investigation ID; empty for bulk evidence }
        referenceUrl: { type: string }
    BulkCoverageProfiles:
      type: object
      required: [profiles, hasMore, nextAfterId, generatedAt]
      properties:
        profiles:
          type: array
          items: { $ref: "#/components/schemas/BulkCoverageProfile" }
        hasMore: { type: boolean }
        nextAfterId: { type: number }
        generatedAt: { type: string }
    BulkCoverageBucket:
      type: object
      required: [group, total, covered, allPlatformsCoveredProfiles, profilesWithActiveLinks, profilesWithLinkCandidates, fullyResolvedProfiles, profilesWithLinksOrFullyResolved, investigated, uncoveredInvestigated, platformBreakdown]
      properties:
        group: { $ref: "#/components/schemas/BulkCoverageGroup" }
        total: { type: number }
        covered: { type: number, description: Profiles with all supported platforms fully resolved. }
        allPlatformsCoveredProfiles:
          type: number
          description: Unique profiles where each supported platform has a saved non-mismatch candidate URL, a completed search with no supported match, or an explicit sourced first-party no-account statement. Provider failures and incomplete searches do not count.
        profilesWithActiveLinks:
          type: number
          description: Unique active profiles with at least one current linked account that has an active account record and a non-empty URL.
        profilesWithLinkCandidates:
          type: number
          description: Unique profiles with at least one saved supported-platform link candidate; candidates are not verified identities.
        fullyResolvedProfiles:
          type: number
          description: Unique profiles with all supported platforms fully resolved.
        profilesWithLinksOrFullyResolved:
          type: number
          description: Unique profiles with at least one saved link candidate or all supported platforms fully resolved; profiles meeting both conditions count once.
        investigated: { type: number }
        uncoveredInvestigated: { type: number }
        platformBreakdown:
          description: Counts among uncovered investigated active profiles only. Platforms overlap; sourced explicit absence resolves that platform, not the whole profile.
          type: array
          items: { $ref: "#/components/schemas/BulkCoveragePlatform" }
    BulkTypeCoverage:
      type: object
      required: [profileType, buckets]
      properties:
        profileType: { $ref: "#/components/schemas/BulkProfileType" }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/BulkCoverageBucket" }
    BulkCoverage:
      type: object
      required: [types, generatedAt, platforms]
      properties:
        types:
          type: array
          items: { $ref: "#/components/schemas/BulkTypeCoverage" }
        generatedAt: { type: string }
        platforms:
          type: array
          items: { type: string }
    MusicianCoverageTier:
      type: object
      required: [tier, profiles, withLlmLinks, withInvestigationLinks]
      properties:
        tier: { type: number }
        profiles: { type: number }
        withLlmLinks: { type: number }
        withInvestigationLinks: { type: number }
    MusicianCoverage:
      type: object
      required: [profiles, withLlmLinks, withInvestigationLinks, tiers, generatedAt]
      properties:
        profiles: { type: number }
        withLlmLinks: { type: number }
        withInvestigationLinks: { type: number }
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/MusicianCoverageTier"
        generatedAt: { type: string, format: date-time }
    MusicianInstagramResearchTier:
      type: object
      required: [tier, totalProfiles, profilesWithInstagramUrls, profilesWithNoSupportedMatch, profilesWithUrlOrNoSupportedMatch]
      properties:
        tier: { type: number }
        totalProfiles: { type: number }
        profilesWithInstagramUrls: { type: number }
        profilesWithNoSupportedMatch: { type: number }
        profilesWithUrlOrNoSupportedMatch: { type: number }
    MusicianInstagramResearchCoverage:
      type: object
      required: [tiers, generatedAt]
      properties:
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/MusicianInstagramResearchTier"
        generatedAt: { type: string, format: date-time }
    ProfileInvestigation:
      type: object
      required: [id, knownProfileUrl, result]
      properties:
        id: { type: string }
        knownProfileUrl: { type: string }
        result:
          $ref: "#/components/schemas/ProfileSearchResponse"
    ProfileInvestigationPage:
      type: object
      required: [investigations, page, limit, hasMore]
      properties:
        investigations:
          type: array
          items:
            $ref: "#/components/schemas/ProfileInvestigation"
        page: { type: number }
        limit: { type: number }
        hasMore: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProfileSearchInput:
      type: object
      properties:
        subject:
          type: string
          minLength: 2
          maxLength: 120
          description: Person or entity name, optionally including role or other identity context. Supports text-only discovery without a reference URL; results require human review.
        targetPlatforms:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: Platforms to search. Omit to search all supported platforms.
          items:
            type: string
            enum: [instagram, tiktok, youtube]
        handle:
          type: string
          minLength: 2
          maxLength: 120
          description: Known social handle, with or without a leading @
        handlePlatform:
          type: string
          enum: [instagram, tiktok, youtube, spotify, web, x, twitter, facebook]
          description: Platform where the known handle belongs
        knownProfileUrl:
          type: string
          maxLength: 500
          description: Public reference-page URL, including ESPN and ESPNcricinfo, or a supported social profile or Spotify artist URL. May be submitted alone; the server resolves the identity from profile metadata or the reference page's indexed title and description.
        location:
          type: string
          maxLength: 100
        country:
          type: string
          minLength: 2
          maxLength: 2
          default: us
        methods:
          type: array
          items:
            type: string
            enum: [serper, tavily, gemini, jev, scrapecreators, socialcrawl]
    BulkProfileType:
      type: string
      enum: [brand, creator, artist]
    BulkProfileScopeInput:
      type: object
      required: [profileType, limit]
      properties:
        profileType: { $ref: "#/components/schemas/BulkProfileType" }
        limit: { type: number, minimum: 1, maximum: 1000 }
    BulkBrandCandidate:
      type: object
      required: [profileId, profileName, tier, tierRank, accountId, platform, handle, url]
      properties:
        profileId: { type: number }
        profileName: { type: string }
        tier: { type: number, nullable: true }
        tierRank: { type: number, nullable: true }
        accountId: { type: string }
        platform: { type: string }
        handle: { type: string }
        url: { type: string }
        accountCount: { type: number }
        canInvestigate: { type: boolean }
        investigationBlockedReason: { type: string }
        accounts:
          type: array
          items:
            type: object
            required: [accountId, platform, handle, url]
            properties:
              accountId: { type: string }
              platform: { type: string }
              handle: { type: string }
              url: { type: string }
        profileType:
          $ref: "#/components/schemas/BulkProfileType"
          description: Legacy saved candidates without this field are brands
    BulkBrandCandidates:
      type: object
      required: [profiles, hasMore, nextAfterId, maxBatchSize]
      properties:
        profiles: { type: array, items: { $ref: "#/components/schemas/BulkBrandCandidate" } }
        hasMore: { type: boolean }
        nextAfterId: { type: number }
        maxBatchSize: { type: number }
    BulkBrandRunInput:
      type: object
      required: [requestId, paidAcknowledged]
      properties:
        requestId: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        launchSource: { $ref: "#/components/schemas/BulkLaunchSource" }
        continuous: { type: boolean, default: false, description: Process remaining unattempted eligible profiles in saved chunks until exhausted or stopped; scopes required }
        profileLimit: { type: number, minimum: 1, maximum: 4294967295, description: Optional total profile-attempt cap for continuous mode; omitted means all remaining eligible profiles }
        workersPerType: { type: number, minimum: 1, maximum: 20, description: Integer concurrent profile lookups per selected type, frozen at start; defaults to 1 }
        selectionMode:
          type: string
          enum: [remaining, rerun]
          description: Automatic scopes default to remaining, excluding completed and previously attempted profiles across all saved bulk events. Manual IDs require rerun.
        paidAcknowledged:
          type: boolean
          description: Must be explicitly true to start paid work, including reruns of completed or uncertain attempts.
        profileIds:
          type: array
          minItems: 1
          maxItems: 25
          items: { type: number, minimum: 1 }
        profileTypes:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: "#/components/schemas/BulkProfileType" }
          description: Manual profileIds selection type; defaults to brand. Use scopes for automatic multi-type selection.
        scopes:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/BulkProfileScopeInput" }
          description: Alternative to profileIds; one distinct entry per selected type. Combined chunk limits must not exceed 1000. Each type uses the selected workersPerType concurrency.
    BulkLaunchSource:
      type: string
      enum: [automatic_launcher, manual_selection, multi_type_widget, run_monitor, unknown]
      description: Client-described UI source only; not identity or authorization. Omission is recorded as unknown.
    BillingOutage:
      type: object
      required: [provider, httpStatus, incidentId, observedAt]
      properties:
        provider: { type: string, enum: [Serper, OpenRouter, ScrapeCreators, SocialCrawl] }
        httpStatus: { type: number, minimum: 100, maximum: 599 }
        incidentId: { type: string }
        observedAt: { type: string }
    BulkBillingHealth:
      type: object
      required: [outages]
      properties:
        outages:
          type: array
          items: { $ref: "#/components/schemas/BillingOutage" }
    BillingRecoveryInput:
      type: object
      required: [provider, incidentId, fundingRestored]
      properties:
        provider: { type: string, enum: [Serper, OpenRouter, ScrapeCreators, SocialCrawl] }
        incidentId: { type: string, minLength: 1 }
        fundingRestored: { type: boolean, enum: [true] }
    BulkRunResumeInput:
      type: object
      required: [requestId, resumeVersion]
      properties:
        requestId: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        resumeVersion: { type: number, minimum: 0 }
        launchSource: { $ref: "#/components/schemas/BulkLaunchSource" }
    BulkAcceptedSettings:
      type: object
      required: [scopes, continuous]
      properties:
        scopes: { type: array, items: { $ref: "#/components/schemas/BulkProfileScopeInput" } }
        continuous: { type: boolean }
        workersPerType: { type: number, minimum: 1, maximum: 20 }
        profileIds: { type: array, items: { type: number } }
        profileLimit: { type: number }
        upperProfileId: { type: number }
    BulkLaunchEvent:
      type: object
      required: [action, requestId, acceptedAt, source, settings, chunkNumber]
      properties:
        action: { type: string, enum: [start, resume] }
        requestId: { type: string }
        acceptedAt: { type: string }
        source: { $ref: "#/components/schemas/BulkLaunchSource" }
        settings: { $ref: "#/components/schemas/BulkAcceptedSettings" }
        chunkNumber: { type: number }
    BulkPlatformOutcome:
      type: object
      required: [platform, status, reason, evidenceUrls, checkedAt]
      properties:
        platform: { type: string, enum: [Instagram, TikTok, YouTube] }
        status: { type: string, enum: [reference, found, needs_review, not_found, incomplete, explicit_unavailable] }
        reason: { type: string }
        evidenceUrls: { type: array, items: { type: string } }
        checkedAt: { type: string }
    BulkBrandItem:
      type: object
      required: [candidate, status, platforms]
      properties:
        candidate: { $ref: "#/components/schemas/BulkBrandCandidate" }
        status: { type: string, enum: [queued, running, completed, failed, skipped], description: Skipped means a confirmed restricted reference profile; no downstream searches or automatic retry. }
        stage:
          type: string
          enum: [reading_reference, searching_platforms, verifying_candidates]
          description: Current coarse lookup stage for running items. Optional for older saved runs; cleared on completion, failure or resume.
        stageStartedAt:
          type: string
          description: Time the current stage began; unchanged by heartbeats.
        platforms: { type: array, items: { $ref: "#/components/schemas/BulkPlatformOutcome" } }
        result: { $ref: "#/components/schemas/ProfileSearchResponse" }
        error: { type: string }
        startedAt: { type: string }
        completedAt: { type: string }
        retryBlocked:
          type: boolean
          description: This item must not be replayed by Resume, including uncertain paid work and confirmed restricted profiles.
    BulkRunControl:
      type: object
      required: [resumeVersion]
      properties:
        resumeVersion: { type: number, minimum: 0 }
    BulkBrandRun:
      type: object
      required: [id, status, createdAt, updatedAt, heartbeatAt, workerId, resumeVersion, stopRequested, estimatedCostUsd, items]
      properties:
        id: { type: string }
        status: { type: string, enum: [running, stopping, stopped, completed, interrupted] }
        createdAt: { type: string }
        updatedAt: { type: string }
        heartbeatAt: { type: string }
        workerId: { type: string }
        workersPerType: { type: number, minimum: 1, maximum: 20, description: Frozen integer concurrent profile lookups per type; legacy runs default to 1 }
        resumeVersion: { type: number }
        stopRequested: { type: boolean }
        estimatedCostUsd: { type: number }
        items: { type: array, items: { $ref: "#/components/schemas/BulkBrandItem" } }
        preparation: { $ref: "#/components/schemas/BulkRunPreparation" }
        selectionMode:
          type: string
          enum: [remaining, rerun]
        scopes:
          type: array
          items: { $ref: "#/components/schemas/BulkProfileScopeInput" }
        continuous: { $ref: "#/components/schemas/BulkContinuousProgress" }
        archiveOf: { type: string }
        batchNumber: { type: number }
        error: { type: string }
        launchHistory:
          type: array
          description: Append-only accepted user Starts and explicit Resumes. Automatic chunk continuation does not add events. Missing on older runs.
          items: { $ref: "#/components/schemas/BulkLaunchEvent" }
    BulkRunPreparation:
      type: object
      required: [status, mode, requested, selected, message]
      properties:
        status: { type: string, enum: [selecting, ready] }
        mode: { type: string, enum: [manual, one_chunk, continuous] }
        requested: { type: number }
        selected: { type: number }
        message: { type: string }
        profileIds: { type: array, items: { type: number } }
        profileLimit: { type: number }
        upperProfileId: { type: number }
        legacyChecked: { type: boolean }
    BulkContinuousProgress:
      type: object
      required: [upperProfileId, batches, completed, failed, completedCostUsd, cursors]
      properties:
        upperProfileId: { type: number }
        profileLimit: { type: number }
        batches: { type: number }
        completed: { type: number }
        failed: { type: number }
        skipped: { type: number, description: Confirmed restricted profiles skipped in archived chunks. Missing on legacy runs means zero. }
        completedCostUsd: { type: number }
        cursors:
          type: array
          items:
            type: object
            required: [profileType, afterId, exhausted, completed, failed]
            properties:
              profileType: { $ref: "#/components/schemas/BulkProfileType" }
              afterId: { type: number }
              exhausted: { type: boolean }
              completed: { type: number }
              failed: { type: number }
              skipped: { type: number }
    BulkBatchArchives:
      type: object
      required: [runs, hasMore, nextBatch]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/BulkBrandRun" } }
        hasMore: { type: boolean }
        nextBatch: { type: number }
    ExistingProfile:
      type: object
      properties:
        profileId:
          type: number
        profileName:
          type: string
        profileTypes:
          type: string
        tier:
          type: number
        tierRank:
          type: number
        instagramFollowers:
          type: [number, "null"]
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ExistingProfileAccount"
      required: [profileId, profileName, profileTypes, tier, tierRank, instagramFollowers, accounts]
    ExistingProfileAccount:
      type: object
      properties:
        platform:
          type: string
        handle:
          type: string
        accountUrl:
          type: string
        source:
          type: string
      required: [platform, handle, accountUrl, source]
    ExistingProfilePage:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ExistingProfile"
        page:
          type: number
        limit:
          type: number
        hasMore:
          type: boolean
        query:
          type: string
      required: [profiles, page, limit, hasMore, query]
    ProfileSuggestionApproval:
      type: object
      properties:
        profileName:
          type: string
          minLength: 1
          maxLength: 200
        suggestions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProfileSuggestionInput"
      required: [profileName, suggestions]
    ProfileSuggestionInput:
      type: object
      properties:
        platform:
          type: string
        handle:
          type: string
        accountUrl:
          type: string
        sourceVendors:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 100
        estimatedCostUsd:
          type: number
          minimum: 0
        sourceDetails:
          type: string
      required:
        [platform, handle, accountUrl, sourceVendors, confidence, estimatedCostUsd, sourceDetails]
    ProfileSuggestionApprovalResult:
      type: object
      properties:
        inserted:
          type: number
        approvedAt:
          type: string
          format: date-time
      required: [inserted, approvedAt]
    ProfileMatch:
      type: object
      properties:
        platform:
          type: string
        category:
          type: string
          enum: [social]
        title:
          type: string
        url:
          type: string
        displayUrl:
          type: string
        channelId:
          type: string
          description: YouTube channel ID confirmed by profile metadata, not artist ownership.
        urlAliases:
          type: array
          description: URLs confirmed by metadata to refer to this same account.
          items: { type: string }
        snippet:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 100
        signals:
          type: array
          items:
            type: string
        methods:
          type: array
          items:
            type: string
        identityComparison:
          $ref: "#/components/schemas/IdentityComparison"
        identityVerificationNote:
          type: string
        jevVerification:
          $ref: "#/components/schemas/JevVerification"
      required:
        - platform
        - category
        - title
        - url
        - displayUrl
        - snippet
        - confidence
        - signals
        - methods
    IdentityMetadata:
      type: object
      properties:
        platform: { type: string }
        handle: { type: string }
        displayName: { type: string }
        bio: { type: string }
        imageUrl: { type: string }
        url: { type: string }
        followers: { type: number }
        verified: { type: boolean }
        channelId: { type: string }
        urlAliases:
          type: array
          items: { type: string }
      required: [platform, handle, url]
    IdentityComparison:
      type: object
      properties:
        status:
          type: string
          enum: [likely, uncertain, mismatch]
        score: { type: number, minimum: 0, maximum: 100 }
        reasons:
          type: array
          items: { type: string }
        reference:
          $ref: "#/components/schemas/IdentityMetadata"
        candidate:
          $ref: "#/components/schemas/IdentityMetadata"
      required: [status, score, reasons, reference, candidate]
    JevVerification:
      type: object
      properties:
        verdict:
          type: string
          enum: [verified, likely, uncertain, mismatch]
        sameIdentityProbability:
          type: number
          minimum: 0
          maximum: 1
        verdictConfidence:
          type: number
          minimum: 0
          maximum: 1
        probabilities:
          type: object
          additionalProperties:
            type: number
      required: [verdict, sameIdentityProbability, verdictConfidence, probabilities]
    SearchMethodUsage:
      type: object
      properties:
        method:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [used, unavailable, failed]
        estimatedCostUsd:
          type: number
        costNote:
          type: string
        durationMs:
          type: number
          minimum: 0
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchSource"
      required:
        - method
        - label
        - status
        - estimatedCostUsd
        - costNote
        - durationMs
        - results
    SearchSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        snippet:
          type: string
      required:
        - title
        - url
        - snippet
    ProfileSearchResponse:
      type: object
      properties:
        referenceProfile:
          $ref: "#/components/schemas/IdentityMetadata"
        historyId:
          type: string
          description: Saved investigation identifier, present when single-profile history was persisted.
        historySaveError:
          type: string
          description: Explicit warning if discovery succeeded but investigation history could not be saved.
        subject:
          type: string
        query:
          type: string
        searchedAt:
          type: string
          format: date-time
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileMatch"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SearchSource"
        totalFound:
          type: number
        highConfidenceCount:
          type: number
        methodsUsed:
          type: array
          items:
            $ref: "#/components/schemas/SearchMethodUsage"
        estimatedCostUsd:
          type: number
      required:
        - subject
        - query
        - searchedAt
        - profiles
        - sources
        - totalFound
        - highConfidenceCount
        - methodsUsed
        - estimatedCostUsd

